name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install dbt-duckdb
      - name: dbt seed + build
        working-directory: dbt_project
        run: |
          dbt seed --target dev
          dbt build --target dev
